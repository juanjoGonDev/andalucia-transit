<div
  class="recent-preview-entry"
  [class.recent-preview-entry--previous]="isPrevious(entry)"
  [class.recent-preview-entry--next]="isNext(entry)"
>
  <div class="recent-preview-entry__header">
    <span class="recent-preview-entry__line">{{ entry.lineCode }}</span>
    <span class="recent-preview-entry__moment">
      <span class="recent-preview-entry__content" aria-hidden="true">
        <span
          class="recent-preview-entry__arrow"
          [class.recent-preview-entry__arrow--previous]="isPrevious(entry)"
          [class.recent-preview-entry__arrow--next]="isNext(entry)"
          aria-hidden="true"
          >{{ isPrevious(entry) ? '↑' : '↓' }}</span
        >
        <span
          class="recent-preview-entry__time"
          [class.recent-preview-entry__time--previous]="isPrevious(entry)"
          [class.recent-preview-entry__time--next]="isNext(entry)"
        >
          {{ entry.departureTime | date: 'HH:mm' }}
        </span>
        <span
          *ngIf="entry.relativeLabel as label"
          class="recent-preview-entry__relative"
          aria-hidden="true"
        >
          {{ label.key | translate: { time: label.text } }}
        </span>
      </span>
      <span
        *ngIf="entry.relativeLabel as spoken"
        class="recent-preview-entry__spoken recent-preview-entry__visually-hidden"
        >{{
          spoken.key
            | translate
              : { time: ('countdown.' + spoken.spoken.unit) | translate: { value: spoken.spoken.value } }
        }}</span
      >
    </span>
  </div>
</div>
