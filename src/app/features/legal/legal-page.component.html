<section class="legal-page" appLayoutContent appLayoutContentSurface="plain">
  <div class="utility-container">
    <article class="legal-page__article">
      <header class="legal-page__header">
        <p class="legal-page__eyebrow">Andalucia Transit</p>
        <h1 class="legal-page__title">{{ content().title }}</h1>
        <p class="legal-page__summary">{{ content().summary }}</p>
        <p class="legal-page__updated">
          <span>{{ content().updatedLabel }}</span>
          <time datetime="2026-08-29">{{ content().updatedAt }}</time>
        </p>
      </header>

      <div class="legal-page__sections">
        <section
          class="legal-page__section"
          *ngFor="let section of content().sections; trackBy: trackSection"
        >
          <h2 class="legal-page__section-title">{{ section.title }}</h2>
          <p
            class="legal-page__paragraph"
            *ngFor="let paragraph of section.paragraphs; trackBy: trackText"
          >
            {{ paragraph }}
          </p>
          <ul class="legal-page__list" *ngIf="section.items?.length" role="list">
            <li
              class="legal-page__list-item"
              *ngFor="let item of section.items; trackBy: trackText"
            >
              {{ item }}
            </li>
          </ul>
        </section>
      </div>
    </article>
  </div>
</section>
