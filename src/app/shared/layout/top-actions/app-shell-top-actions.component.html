<nav class="shell-actions">
  <div class="shell-actions__container">
    <div class="shell-actions__shell">
      <div class="shell-actions__buttons">
        <a
          class="shell-actions__button shell-actions__button--quick"
          [class.shell-actions__button--active]="homeActive()"
          [routerLink]="homeLinkCommands"
          [attr.aria-current]="homeActive() ? 'page' : null"
          [attr.aria-label]="homeLabelKey | translate"
        >
          <span class="material-symbols-outlined shell-actions__button-icon" aria-hidden="true">home</span>
          <span class="shell-actions__button-label">{{ homeLabelKey | translate }}</span>
        </a>
        <a
          class="shell-actions__button shell-actions__button--quick"
          [class.shell-actions__button--active]="routeSearchActive()"
          [routerLink]="routeSearchLinkCommands"
          [attr.aria-current]="routeSearchActive() ? 'page' : null"
          [attr.aria-label]="routeSearchLabelKey | translate"
        >
          <span class="material-symbols-outlined shell-actions__button-icon" aria-hidden="true">route</span>
          <span class="shell-actions__button-label">{{ routeSearchShortLabelKey | translate }}</span>
        </a>
        <a
          class="shell-actions__button shell-actions__button--quick"
          [class.shell-actions__button--active]="mapActive()"
          [routerLink]="mapLinkCommands"
          [attr.aria-current]="mapActive() ? 'page' : null"
          [attr.aria-label]="mapLabelKey | translate"
        >
          <span class="material-symbols-outlined shell-actions__button-icon" aria-hidden="true">map</span>
          <span class="shell-actions__button-label">{{ mapLabelKey | translate }}</span>
        </a>
        <a
          class="shell-actions__button shell-actions__button--quick"
          [class.shell-actions__button--active]="favoritesActive()"
          [routerLink]="favoritesLinkCommands"
          [attr.aria-current]="favoritesActive() ? 'page' : null"
          [attr.aria-label]="favoritesLabelKey | translate"
        >
          <span class="material-symbols-outlined shell-actions__button-icon" aria-hidden="true">star</span>
          <span class="shell-actions__button-label">{{ favoritesLabelKey | translate }}</span>
        </a>
        <div class="shell-actions__menu">
          <button
            type="button"
            class="shell-actions__button shell-actions__button--menu"
            [class.shell-actions__button--active]="menuOpen() || moreActive()"
            [attr.aria-expanded]="menuOpen()"
            aria-haspopup="menu"
            [attr.aria-label]="menuLabelKey | translate"
            (click)="toggleMenu()"
            (keydown.escape)="closeMenu()"
          >
            <span class="material-symbols-outlined shell-actions__button-icon" aria-hidden="true">menu</span>
          </button>
          <div class="shell-actions__panel" *ngIf="menuOpen()">
            <ul class="shell-actions__list" role="menu">
              <li class="shell-actions__item" *ngFor="let entry of menuEntries()">
                <a
                  class="shell-actions__menu-button"
                  role="menuitem"
                  [routerLink]="entry.commands"
                  [attr.aria-current]="entry.isActive ? 'page' : null"
                  (click)="closeMenu()"
                >
                  <span class="shell-actions__menu-label">{{ entry.labelKey | translate }}</span>
                  <span
                    *ngIf="entry.isActive"
                    class="material-symbols-outlined shell-actions__menu-current"
                    aria-hidden="true"
                    >check</span
                  >
                </a>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </div>
</nav>
