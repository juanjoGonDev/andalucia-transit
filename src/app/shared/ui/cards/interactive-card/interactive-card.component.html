<ng-template #primaryContent>
  <ng-content></ng-content>
</ng-template>

@if (computedPrimaryCommands; as commands) {
  <a
    [ngClass]="bodyClasses"
    [attr.role]="computedPrimaryRole"
    [routerLink]="commands"
    [queryParams]="primaryQueryParams"
    [attr.aria-pressed]="primaryPressed"
    [attr.aria-label]="primaryAriaLabel"
    (click)="handlePrimaryActivated()"
  >
    <ng-container *ngTemplateOutlet="primaryContent"></ng-container>
  </a>
} @else {
  <button
    type="button"
    [ngClass]="bodyClasses"
    [attr.role]="computedPrimaryRole"
    [attr.aria-pressed]="primaryPressed"
    [attr.aria-label]="primaryAriaLabel"
    (click)="handlePrimaryActivated()"
  >
    <ng-container *ngTemplateOutlet="primaryContent"></ng-container>
  </button>
}

<button
  *ngIf="removeAriaLabel"
  type="button"
  [ngClass]="removeClasses"
  [attr.aria-label]="removeAriaLabel"
  (click)="handleRemoveActivated($event)"
>
  <span [ngClass]="removeIconClass">{{ removeIconName }}</span>
</button>
