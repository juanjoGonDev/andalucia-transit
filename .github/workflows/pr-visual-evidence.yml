name: Publish PR visual evidence

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions: read-all

concurrency:
  group: pr-visual-evidence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  publish:
    name: "🖼️ Publish PR screenshots"
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      EVIDENCE_TAG: pr-${{ github.event.pull_request.number }}-visual-evidence
    steps:
      - name: Checkout validated head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.19.0

      - name: Install deterministic tooling
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@9.12.3 --activate
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Start deterministic mock application
        shell: bash
        run: |
          set -euo pipefail
          pnpm run dev:mock-data -- --host 127.0.0.1 --port 4200 > "$RUNNER_TEMP/andalucia-transit.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/andalucia-transit.pid"
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:4200/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/andalucia-transit.log" >&2
          exit 1

      - name: Capture canonical mobile and desktop screens
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence-assets

          capture() {
            route=$1
            slug=$2
            pnpm run screenshot -- \
              --url="http://127.0.0.1:4200${route}" \
              --waitFor=app-root \
              --outDir=evidence-assets \
              --name="$slug" \
              --locale=es \
              --breakpoints=390x844,1440x900 \
              --fullPage=true
          }

          capture / home
          capture /routes route-search
          capture /favorites favorites
          capture /settings settings
          capture /news news

          test "$(find evidence-assets -maxdepth 1 -type f -name '*.png' | wc -l)" -eq 10
          while IFS= read -r file; do
            test "$(stat -c %s "$file")" -le 25000000
          done < <(find evidence-assets -maxdepth 1 -type f -name '*.png' -print)

      - name: Verify evidence belongs to current PR head
        shell: bash
        run: |
          set -euo pipefail
          current_head=$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')
          if [ "$current_head" != "$HEAD_SHA" ]; then
            echo "Refusing stale visual evidence publication: event head $HEAD_SHA, current PR head $current_head" >&2
            exit 1
          fi

      - name: Replace temporary visual-evidence release
        shell: bash
        run: |
          set -euo pipefail
          gh release delete "$EVIDENCE_TAG" \
            --repo "$REPOSITORY" \
            --cleanup-tag \
            --yes >/dev/null 2>&1 || true

          current_head=$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')
          if [ "$current_head" != "$HEAD_SHA" ]; then
            echo "Refusing stale visual evidence publication after cleanup" >&2
            exit 1
          fi

          gh release create "$EVIDENCE_TAG" evidence-assets/*.png \
            --repo "$REPOSITORY" \
            --target "$HEAD_SHA" \
            --prerelease \
            --title "PR #$PR_NUMBER visual evidence" \
            --notes "Temporary screenshots generated from $HEAD_SHA. Removed automatically when the pull request closes."

      - name: Publish or update PR visual-evidence comment
        shell: bash
        run: |
          set -euo pipefail
          marker='<!-- andalucia-transit-visual-evidence -->'
          base="https://github.com/$REPOSITORY/releases/download/$EVIDENCE_TAG"
          run_url="https://github.com/$REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          cat > comment.md <<EOF
          $marker
          ## Visual evidence

          Mandatory screenshots generated from final head \`$HEAD_SHA\` by the [visual evidence workflow]($run_url). Media is temporary and is not committed to the repository.

          | Screen | Mobile · 390×844 | Desktop · 1440×900 |
          | --- | --- | --- |
          | Home | <img src="$base/home_es_390_844.png" width="220" alt="Home screen at 390 by 844 pixels"> | <img src="$base/home_es_1440_900.png" width="420" alt="Home screen at 1440 by 900 pixels"> |
          | Route search | <img src="$base/route-search_es_390_844.png" width="220" alt="Route search at 390 by 844 pixels"> | <img src="$base/route-search_es_1440_900.png" width="420" alt="Route search at 1440 by 900 pixels"> |
          | Favorites | <img src="$base/favorites_es_390_844.png" width="220" alt="Favorites at 390 by 844 pixels"> | <img src="$base/favorites_es_1440_900.png" width="420" alt="Favorites at 1440 by 900 pixels"> |
          | Settings | <img src="$base/settings_es_390_844.png" width="220" alt="Settings at 390 by 844 pixels"> | <img src="$base/settings_es_1440_900.png" width="420" alt="Settings at 1440 by 900 pixels"> |
          | News | <img src="$base/news_es_390_844.png" width="220" alt="News at 390 by 844 pixels"> | <img src="$base/news_es_1440_900.png" width="420" alt="News at 1440 by 900 pixels"> |
          EOF

          current_head=$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')
          if [ "$current_head" != "$HEAD_SHA" ]; then
            echo "Refusing stale visual evidence comment" >&2
            exit 1
          fi

          comment_id=$(gh api --paginate "repos/$REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.body | contains(\"$marker\")) | .id" | head -n 1)
          jq -n --rawfile body comment.md '{body: $body}' > payload.json
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$REPOSITORY/issues/comments/$comment_id" --input payload.json >/dev/null
          else
            gh api --method POST "repos/$REPOSITORY/issues/$PR_NUMBER/comments" --input payload.json >/dev/null
          fi

      - name: Stop application
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/andalucia-transit.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/andalucia-transit.pid")" >/dev/null 2>&1 || true
          fi
